<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head>
    <title>New Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f7f4ef; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .reset-card { background: white; padding: 40px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center; max-width: 400px; width: 100%; }
        h2 { font-family: 'Playfair Display', serif; font-style: italic; color: #1a1a1a; margin-bottom: 10px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 8px; color: #1a1a1a; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-primary { width: 100%; background: #C47D2B; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-primary:hover { background: #a8691e; }
    </style>
</h:head>
<h:body>
    <div class="reset-card">
        <h2>Create New Password</h2>

        <h:form>
            <div class="input-group">
                <label>New Password</label>
                <h:inputSecret value="#{authBean.newMotDePasse}" required="true" requiredMessage="Password is required" styleClass="form-control" />
            </div>

            <h:commandButton value="Save Password" action="#{authBean.validerNouveauMotDePasse()}" class="btn-primary" />
        </h:form>
    </div>
</h:body>
</html>
