<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head>
    <title>Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f7f4ef; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .reset-card { background: white; padding: 40px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center; max-width: 400px; width: 100%; }
        h2 { font-family: 'Playfair Display', serif; font-style: italic; color: #1a1a1a; margin-bottom: 10px; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 25px; line-height: 1.5; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 8px; color: #1a1a1a; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        .btn-primary { width: 100%; background: #C47D2B; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .btn-primary:hover { background: #a8691e; }
        .error-msg { color: #d9534f; font-size: 0.9rem; margin-bottom: 15px; display: block; }
        .back-link { display: inline-block; margin-top: 20px; color: #C47D2B; text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
    </style>
</h:head>
<h:body>
    <div class="reset-card">
        <h2>Security Check</h2>
        <p>Please enter your email and your secret code to reset your password.</p>

        <h:form>
            <h:outputText value="#{authBean.messageErreur}" styleClass="error-msg" rendered="#{not empty authBean.messageErreur}"/>

            <div class="input-group">
                <label>Email Address</label>
                <h:inputText value="#{authBean.resetEmail}" required="true" requiredMessage="Email is required" styleClass="form-control" />
            </div>

            <div class="input-group">
                <label>Secret Code (Recovery Code)</label>
                <h:inputSecret value="#{authBean.resetRecoveryCode}" required="true" requiredMessage="Secret code is required" styleClass="form-control" />
            </div>
            <h:commandButton value="Verify Code" action="#{authBean.verifierCode()}" class="btn-primary" />
        </h:form>

        <h:outputLink value="login.xhtml" class="back-link">
            ← Back to Login
        </h:outputLink>
    </div>
</h:body>
</html>
